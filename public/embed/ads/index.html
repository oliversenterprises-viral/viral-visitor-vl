<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ViralRefer Ads Embed</title>
    <meta name="robots" content="noindex" />
    <!--
      Same-origin iframe URL (works on viralrefer.app pages):
      https://www.viralrefer.app/embed/ads/

      Or cross-origin (any site):
      https://ads.viralrefer.app/frame.html
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #070a12;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 360px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe
      id="ads"
      src="https://ads.viralrefer.app/frame.html"
      title="ViralRefer sponsored ads"
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="clipboard-write"
    ></iframe>
    <script>
      window.addEventListener('message', function (ev) {
        if (!ev.data || ev.data.type !== 'viralrefer-ads-embed') return;
        if (typeof ev.data.height === 'number' && ev.data.height > 0) {
          document.getElementById('ads').style.height = ev.data.height + 'px';
          document.body.style.minHeight = ev.data.height + 'px';
        }
      });
    </script>
  </body>
</html>
