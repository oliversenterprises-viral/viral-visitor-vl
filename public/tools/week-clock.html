<body>

    <h1>Week reset clock</h1>
    <p class="muted">ViralRefer weeks start <strong>Monday 00:00 UTC</strong>. Last week’s friends do not carry over. Same /r/ link. No cash prize.</p>
    <p id="next" class="muted"></p>
    <div class="clock" aria-live="polite">
      <div class="cell"><b id="d">0</b><span>Days</span></div>
      <div class="cell"><b id="h">0</b><span>Hours</span></div>
      <div class="cell"><b id="m">0</b><span>Minutes</span></div>
      <div class="cell"><b id="s">0</b><span>Seconds</span></div>
    </div>
    <p class="muted">Your local time: <span id="local"></span></p>
    <a class="btn" href="https://www.viralrefer.app/?utm_source=week_clock&amp;utm_medium=organic&amp;utm_campaign=cta#get-link">Get my referral link</a>
    <p class="muted" style="margin-top:1.2rem">Guide: <a href="/guides/weekly-reset/">When the week resets</a></p>
  </div>
  <script>
    function nextMondayUtc(from) {
      const t = new Date(from);
      const day = t.getUTCDay();
      const add = day === 1 && (t.getUTCHours() + t.getUTCMinutes() + t.getUTCSeconds() + t.getUTCMilliseconds() === 0) ? 0 : (day === 0 ? 1 : (8 - day) % 7 || 7);
      const n = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate() + add, 0, 0, 0, 0));
      if (n <= t) n.setUTCDate(n.getUTCDate() + 7);
      return n;
    }
    function tick() {
      const now = new Date();
      const n = nextMondayUtc(now);
      const ms = Math.max(0, n - now);
      const d = Math.floor(ms / 86400000);
      const h = Math.floor(ms / 3600000) % 24;
      const m = Math.floor(ms / 60000) % 60;
      const s = Math.floor(ms / 1000) % 60;
      document.getElementById("d").textContent = String(d);
      document.getElementById("h").textContent = String(h).padStart(2, "0");
      document.getElementById("m").textContent = String(m).padStart(2, "0");
      document.getElementById("s").textContent = String(s).padStart(2, "0");
      document.getElementById("next").textContent = "Next reset: " + n.toISOString().replace(".000Z", " UTC");
      document.getElementById("local").textContent = n.toLocaleString(undefined, { weekday: "long", hour: "numeric", minute: "2-digit", timeZoneName: "short" });
    }
    tick();
    setInterval(tick, 1000);
  </script>
