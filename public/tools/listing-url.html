<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ViralRefer listing URL builder — never use /r/ as the public URL · ViralRefer</title>
  <meta name="description" content="Build a tracked ViralRefer homepage URL for directories and bios. Do not paste a personal /r/ code as the listing URL. UTM + #get-link. No cash prize." />
  <link rel="canonical" href="https://www.viralrefer.app/tools/listing-url.html" />
  <meta property="og:title" content="Listing URL builder" />
  <meta property="og:description" content="Homepage + UTM. Never a personal /r/ code." />
  <meta property="og:url" content="https://www.viralrefer.app/tools/listing-url.html" />
  <meta property="og:image" content="https://www.viralrefer.app/assets/og-homepage-banner-v2.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root{--bg:#09090b;--text:#f4f4f5;--muted:#a1a1aa;--border:rgba(255,255,255,.12)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(800px 400px at 0 0,rgba(134,76,255,.28),transparent),var(--bg);color:var(--text);line-height:1.5;padding:0 1rem 3rem}
    a{color:#c4b5fd}.w{max-width:720px;margin:0 auto}.nav{display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;padding:1rem 0}
    .brand{font-weight:800;color:#fff;text-decoration:none}h1{font-size:clamp(1.4rem,4.5vw,1.9rem)}
    label{display:block;margin:.8rem 0 .35rem;color:var(--muted);font-weight:600}
    input,select{width:100%;min-height:48px;border-radius:.8rem;border:1px solid var(--border);background:rgba(0,0,0,.35);color:#fff;padding:.7rem .9rem;font:16px inherit}
    .out{margin-top:1rem;padding:.9rem;border-radius:.8rem;border:1px solid var(--border);background:rgba(0,0,0,.35);overflow-wrap:anywhere}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.75rem 1.1rem;border-radius:.85rem;background:linear-gradient(135deg,#864cff,#6b3acc);color:#fff;font-weight:700;border:0;cursor:pointer;font:inherit;margin-top:.6rem}
    .muted{color:var(--muted)}
  </style>
</head>
<body>
  <div class="w">
    <div class="nav"><a class="brand" href="./">← Free tools</a><a href="https://www.viralrefer.app/?utm_source=listing_url&amp;utm_medium=organic&amp;utm_campaign=tools_2026#get-link">Get free link →</a></div>
    <h1>Listing URL builder</h1>
    <p class="muted">For bios and directories. Never use a personal <code>/r/VIRAL-…</code> as the public listing URL. No cash prize.</p>
    <label for="src">utm_source (place name)</label>
    <input id="src" maxlength="40" placeholder="indiehackers" />
    <label for="med">utm_medium</label>
    <select id="med"><option value="listing">listing</option><option value="social">social</option><option value="organic">organic</option></select>
    <p class="out" id="out"></p>
    <button type="button" class="btn" id="copy">Copy URL</button>
    <p class="muted" id="msg"></p>
    <a class="btn" style="text-decoration:none" href="https://www.viralrefer.app/?utm_source=listing_url&amp;utm_medium=organic&amp;utm_campaign=cta#get-link">Get my referral link</a>
  </div>
  <script>
    function slug(s) { return (s || "place").toLowerCase().replace(/[^a-z0-9_-]+/g, "").slice(0, 40) || "place"; }
    function url() {
      const src = slug(document.getElementById("src").value);
      const med = document.getElementById("med").value;
      return "https://www.viralrefer.app/?utm_source=" + encodeURIComponent(src) + "&utm_medium=" + encodeURIComponent(med) + "&utm_campaign=maker_2026#get-link";
    }
    function draw() { document.getElementById("out").textContent = url(); }
    document.getElementById("src").addEventListener("input", draw);
    document.getElementById("med").addEventListener("change", draw);
    document.getElementById("copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(url()); document.getElementById("msg").textContent = "Copied."; }
      catch { document.getElementById("msg").textContent = "Select the URL and copy it."; }
    });
    draw();
  </script>
</body>
</html>
