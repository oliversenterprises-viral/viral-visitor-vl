<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ultra Admin — stub</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; --bg:#050508; --panel:#10131c; --line:#2a2d3a; --ink:#f4f1ea; --muted:#9a9588; --volt:#d6ff3e; --hot:#ff3d8a; --ice:#3ee8ff; --gold:#ffc857; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Outfit, ui-sans-serif, system-ui, sans-serif; background: #050508; color: var(--ink); }
      header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
      .word { font-weight: 800; } .word span { color: var(--volt); }
      .pill { border: 1px solid rgba(255,200,87,.4); color: var(--gold); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
      main { padding: 20px; max-width: 1100px; margin: 0 auto; }
      h1 { font-size: 28px; margin: 0 0 8px; }
      .sub { color: var(--muted); margin-bottom: 20px; }
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
      @media (max-width: 700px) { .stats { grid-template-columns: 1fr 1fr; } }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
      .card b { display: block; font-size: 26px; color: var(--volt); }
      .card small { color: var(--muted); }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-weight: 600; }
      .rung { color: var(--ice); font-weight: 700; }
    </style>
  </head>
  <body>
    <header>
      <div class="word">ViralRefer <span>Ultra</span> · HQ</div>
      <span class="pill">STUB · DEMO DATA</span>
    </header>
    <main>
      <h1>Admin dashboard</h1>
      <p class="sub">Partial v1 desk. Unique friend locks only — no fake counts. KV bind still optional.</p>
      <div class="stats">
        <div class="card"><b id="sites">—</b><small>Live sites</small></div>
        <div class="card"><b id="players">—</b><small>Players</small></div>
        <div class="card"><b id="banner">—</b><small>#1 banner</small></div>
        <div class="card"><b id="week">—</b><small>UTC week</small></div>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>Site</th><th>Rung</th><th>Week locks</th><th>Heat</th></tr></thead>
          <tbody id="rows">
            <tr><td colspan="4">Loading board…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
    <script>
      fetch('/api/board').then((r) => r.json()).then((d) => {
        const b = d.board || {};
        document.getElementById('sites').textContent = b.liveSites ?? 0;
        document.getElementById('players').textContent = b.livePlayers ?? 0;
        document.getElementById('banner').textContent = b.banner?.label || 'open';
        document.getElementById('week').textContent = b.weekId || '—';
        const rows = [b.banner, ...(b.challenger||[]), ...(b.rising||[]), ...(b.entered||[]), ...(b.race||[])]
          .filter(Boolean)
          .filter((s, i, a) => a.findIndex((x) => x.host === s.host) === i);
        document.getElementById('rows').innerHTML = rows.length
          ? rows.map((s) => `<tr><td>${s.label}</td><td class="rung">${s.rung}</td><td>${s.weeklyCredits}</td><td>${s.heat}</td></tr>`).join('')
          : '<tr><td colspan="4">Board empty — demo stub still live.</td></tr>';
      }).catch(() => {
        document.getElementById('rows').innerHTML = '<tr><td colspan="4">API offline — stub desk only.</td></tr>';
      });
    </script>
  </body>
</html>
